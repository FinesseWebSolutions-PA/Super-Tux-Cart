<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kart Rush</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E%F0%9F%8F%8E%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="hud-top-left">
      <div id="lap">LAP 1 / 3</div>
      <div id="place">1st</div>
    </div>
    <div id="hud-top-right">
      <div id="timer">00:00.00</div>
    </div>
    <div id="hud-bottom-right">
      <div id="speed">0 <span>km/h</span></div>
      <div id="boost-bar"><div id="boost-fill"></div></div>
    </div>
  </div>

  <div id="countdown"></div>

  <div id="results" class="hidden">
    <h1>Race Finished!</h1>
    <ol id="results-list"></ol>
    <p class="hint">Press <b>R</b> to race again</p>
  </div>

  <div id="intro">
    <h1>KART RUSH</h1>
    <p>A Super&nbsp;Tux&nbsp;Kart&#8209;style arcade racer</p>
    <div class="controls">
      <div><b>&uarr; / W</b> Accelerate</div>
      <div><b>&darr; / S</b> Brake / Reverse</div>
      <div><b>&larr; &rarr; / A D</b> Steer</div>
      <div><b>Shift</b> Drift (hold + turn for a mini&#8209;turbo)</div>
    </div>
    <button id="start-btn">Start Race</button>
  </div>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/track.js"></script>
  <script src="js/kart.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
